# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: saju-explore
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: COMMUNITY_DATA_PATH
        value: /app/data
